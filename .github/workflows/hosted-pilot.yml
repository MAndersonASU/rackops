name: hosted strategy pilot
on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact Responses API model ID
        required: true
        default: gpt-6-sol
      reasoning_effort:
        description: Fixed reasoning effort
        required: true
        type: choice
        options: [none, low, medium, high]
        default: none
      budget_usd:
        description: Total USD cap split across the two development calls
        required: true
      input_usd_per_million:
        description: Current standard input price per million tokens
        required: true
        default: '2.0'
      output_usd_per_million:
        description: Current standard output price per million tokens
        required: true
        default: '10.0'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RACKOPS_LLM_MODEL: ${{ inputs.model }}
      RACKOPS_LLM_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      RACKOPS_LLM_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million }}
      RACKOPS_LLM_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million }}
      RACKOPS_LLM_MAX_ATTEMPTS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Validate explicit paid-run configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOTAL_BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          test -n "$OPENAI_API_KEY"
          python - <<'PY'
          import math, os
          value = float(os.environ["TOTAL_BUDGET_USD"])
          if not math.isfinite(value) or value <= 0:
              raise SystemExit("budget_usd must be finite and positive")
          PY
      - name: Verify requested model access without a paid generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import json, os
          import httpx

          allowed = {
              "gpt-6-astra",
              "gpt-6-sol",
              "gpt-6-luna",
              "gpt-5.6-sol",
              "gpt-5.6-terra",
              "gpt-5.6-luna",
              "gpt-5.5",
          }
          response = httpx.get(
              "https://api.openai.com/v1/models",
              headers={"Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}"},
              timeout=30,
              trust_env=False,
          )
          if response.status_code != 200:
              raise SystemExit(f"Model access check failed with HTTP {response.status_code}")
          body = response.json()
          visible = sorted(
              item["id"]
              for item in body.get("data", [])
              if type(item) is dict and item.get("id") in allowed
          )
          print("Visible RackOps candidate models: " + json.dumps(visible))
          if os.environ["REQUESTED_MODEL"] not in visible:
              raise SystemExit("Requested model is not visible to this API project")
          PY
      - run: rackops lab up
      - name: Run one basic and one structured development case
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOTAL_BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          RACKOPS_LLM_BUDGET_USD=$(python -c 'import os; print(float(os.environ["TOTAL_BUDGET_USD"])/2)')
          export RACKOPS_LLM_BUDGET_USD
          rackops evaluate-dev --strategy basic --scenario healthy
          rackops evaluate-dev --strategy structured --scenario bad_redis_host
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-pilot-records
          path: results/raw/
          if-no-files-found: warn
      - if: always()
        run: rackops lab down
