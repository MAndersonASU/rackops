name: deterministic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: rackops demo-fixture
  kind-smoke:
    # Manual until the lab integration has been validated; no API keys or paid calls.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: rackops lab up
      - name: Verify restricted agent Role
        run: |
          account=system:serviceaccount:rackops-lab:rackops-agent
          kubectl --context kind-rackops -n rackops-lab auth can-i get deployment/rackops-api --as="$account" --quiet
          kubectl --context kind-rackops -n rackops-lab auth can-i patch deployment/rackops-api --as="$account" --quiet
          ! kubectl --context kind-rackops -n rackops-lab auth can-i patch deployment/redis --as="$account" --quiet
          ! kubectl --context kind-rackops -n rackops-lab auth can-i list secrets --as="$account" --quiet
          ! kubectl --context kind-rackops -n rackops-lab auth can-i patch pods --as="$account" --quiet
      - run: rackops lab inject
      - run: rackops lab baseline --expect verified_repair --expect-cause bad_dependency_configuration --expect-repairs 1
      - run: rackops lab recover
      - run: rackops lab inject --scenario bad_service_port
      - run: rackops lab baseline --expect verified_repair --expect-cause bad_service_target_port --expect-repairs 1
      - run: rackops lab recover
      - run: rackops lab inject --scenario bad_image
      - run: rackops lab baseline --expect verified_repair --expect-cause broken_image --expect-repairs 1
      - run: rackops lab recover
      - run: rackops lab inject --scenario redis_outage
      - run: rackops lab baseline --expect escalated --expect-cause unsupported_dependency_outage --expect-repairs 0
      - run: rackops lab recover
      - run: rackops lab inject --scenario healthy
      - run: rackops lab baseline --expect healthy_no_action --expect-cause healthy --expect-repairs 0
      - name: Run trusted serial development evaluator
        run: rackops evaluate-dev --scenario bad_redis_host --scenario healthy --scenario redis_outage
      - if: always()
        run: rackops lab down
